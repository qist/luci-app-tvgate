name: Build LuCI package (ipk / apk)

# 产物：
#   OpenWrt 22.03.x → luci-app-tvgate_*_all.ipk（opkg）
#   OpenWrt 25.12.x → luci-app-tvgate-*.apk   （apk-tools）
# 另附 luci-i18n-tvgate-* 语言包。
#
# 历史失败原因（已修）：
#   1. SDK 不自带 feeds，Makefile 里 include $(TOPDIR)/feeds/luci/luci.mk 直接报 No such file
#      → 必须先 ./scripts/feeds update luci && ./scripts/feeds install luci-base
#   2. 包未选中（CONFIG_PACKAGE_luci-app-tvgate=m），compile 是空转、不产出任何包
#      → defconfig 前写入 .config，并先删 tmp 强制重扫 package 目录
#   3. 产物在 bin/packages/<arch>/base（PKGARCH=all），原 workflow 去 bin/packages/<arch>/luci 找
#      → 改用 find bin/packages 收集
#   4. 22.03 的 luci-base host 工具 lemon.c 是 K&R 写法，GCC 14 按 C23 解析报
#      "conflicting types"（ubuntu-latest 默认 gcc-14）→ 用 cc 包装强制 -std=gnu17
#   另：25.12 SDK 是 .tar.zst，需要 zstd；actions/cache@v3 已废弃 → v4。

# 只在打 tag 时构建：push tag → 编译 ipk + apk → 自动创建/更新同名 Release。
# 普通 push 到分支、PR 都不触发；也不再提供手动触发入口。
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenWrt 22.03.5 · ipk
            version: "22.03.5"
            format: ipk
            sdk_url: https://downloads.openwrt.org/releases/22.03.5/targets/x86/64/openwrt-sdk-22.03.5-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz
            sdk_archive: openwrt-sdk-22.03.5.tar.xz
            cc_shim: "true"
          - name: OpenWrt 25.12.0-rc2 · apk
            version: "25.12.0-rc2"
            format: apk
            sdk_url: https://downloads.openwrt.org/releases/25.12.0-rc2/targets/x86/64/openwrt-sdk-25.12.0-rc2-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
            sdk_archive: openwrt-sdk-25.12.tar.zst
            cc_shim: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make git rsync curl wget ca-certificates \
            xz-utils zstd unzip file python3 python3-setuptools \
            libncurses-dev libssl-dev zlib1g-dev bison flex gawk gettext \
            pkg-config autoconf automake libtool scons squashfs-tools cpio

      # SDK 必须每次解压：缓存只包含 staging_dir/downloads/feeds，
      # 若在缓存命中时跳过解压，SDK 根目录的 Makefile/scripts 都不存在，后续 make 直接失败。
      - name: Download and extract OpenWrt SDK
        run: |
          cd "$HOME"
          rm -rf openwrt-sdk-* 2>/dev/null || true
          curl -fL --retry 3 --retry-delay 5 -o "${{ matrix.sdk_archive }}" "${{ matrix.sdk_url }}"
          case "${{ matrix.sdk_archive }}" in
            *.tar.zst) tar -I zstd -xf "${{ matrix.sdk_archive }}" ;;
            *)         tar -xf "${{ matrix.sdk_archive }}" ;;
          esac
          rm -f "${{ matrix.sdk_archive }}"

      # ------------------ 缓存编译产物 / 下载 / feeds（在解压之后覆盖） ------------------
      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            $HOME/openwrt-sdk-*/staging_dir
            $HOME/openwrt-sdk-*/downloads
            $HOME/openwrt-sdk-*/feeds
          key: openwrt-sdk-v4-${{ matrix.version }}-${{ matrix.sdk_archive }}
          restore-keys: |
            openwrt-sdk-v4-${{ matrix.version }}-

      - name: Set SDK_DIR
        run: |
          SDK_DIR=$(find "$HOME" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -1)
          test -n "$SDK_DIR"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"
          echo "SDK_DIR=$SDK_DIR"

      # 22.03 的 luci-base host 工具 lemon.c 在新 GCC 下会因 K&R 原型报 conflicting types，
      # 用 cc 包装强制 -std=gnu17（C17 下 "()" 仍是未指定参数，与定义兼容）。
      - name: Install legacy C standard shim (22.03 only)
        if: matrix.cc_shim == 'true'
        run: |
          mkdir -p "$HOME/ccshim"
          printf '#!/bin/sh\nexec /usr/bin/cc -std=gnu17 "$@"\n' > "$HOME/ccshim/cc"
          chmod +x "$HOME/ccshim/cc"
          echo "$HOME/ccshim" >> "$GITHUB_PATH"

      # ------------------ 取 feeds（luci.mk / luci-base host 工具） ------------------
      - name: Update luci feed
        run: |
          cd "$SDK_DIR"
          # 官方 git.openwrt.org 偶发 TLS 中断，失败重试；仍失败则用 GitHub 镜像按 pinned commit 浅取
          for i in 1 2 3; do
            if ./scripts/feeds update luci; then break; fi
            echo "feeds update attempt $i failed, retrying..."
            rm -rf feeds/luci
            sleep 5
          done

          if [ ! -f feeds/luci/luci.mk ]; then
            echo "fallback: shallow fetch luci @ pinned commit from GitHub mirror"
            SHA=$(sed -n 's#^src-git[^ ]* luci .*\^\([0-9a-f]\{40\}\)$#\1#p' feeds.conf.default)
            test -n "$SHA"
            rm -rf feeds/luci
            git init -q feeds/luci
            git -C feeds/luci remote add origin https://github.com/openwrt/luci.git
            git -C feeds/luci fetch --depth 1 origin "$SHA"
            git -C feeds/luci checkout -q FETCH_HEAD
            ./scripts/feeds update -i
          fi

          test -f feeds/luci/luci.mk
          ./scripts/feeds install luci-base

      # ------------------ 把当前 tag 的源码放进 SDK ------------------
      - name: Add luci-app-tvgate to SDK
        run: |
          rm -rf "$SDK_DIR/package/luci-app-tvgate"
          mkdir -p "$SDK_DIR/package/luci-app-tvgate"
          rsync -a --exclude '.git' "$GITHUB_WORKSPACE"/ "$SDK_DIR/package/luci-app-tvgate"/
          ls -la "$SDK_DIR/package/luci-app-tvgate/Makefile"

      - name: Read PKG_VERSION
        run: |
          PKG_VERSION=$(sed -n 's/^PKG_VERSION:=//p' "$SDK_DIR/package/luci-app-tvgate/Makefile" | tr -d ' ')
          test -n "$PKG_VERSION"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "Detected PKG_VERSION=$PKG_VERSION"

      # ------------------ 选中包并编译 ------------------
      - name: Configure and build
        env:
          FORCE_UNSAFE_CONFIGURE: 1
        run: |
          cd "$SDK_DIR"
          # 必须删掉旧 tmp：否则 .config-package.in 还是 feeds 安装前的缓存，包不会被识别
          rm -rf tmp
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-tvgate=m" >> .config
          make defconfig
          grep -q '^CONFIG_PACKAGE_luci-app-tvgate=m' .config
          make package/luci-app-tvgate/compile V=s

      # ------------------ 收集产物（ipk 或 apk，统一放 dist/ 并加版本前缀） ------------------
      - name: Collect packages
        id: collect
        run: |
          mkdir -p dist
          COUNT=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            cp "$f" "dist/openwrt-${{ matrix.version }}-$(basename "$f")"
            COUNT=$((COUNT + 1))
          done < <(find "$SDK_DIR/bin/packages" -type f \( -name '*tvgate*.ipk' -o -name '*tvgate*.apk' \) | sort)

          echo "== collected =="
          ls -lh dist || true
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未找到任何 tvgate 包（ipk/apk）"
            exit 1
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-tvgate-${{ matrix.version }}-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error

  # 打 tag 时自动挂到 Release：一个 ipk（22.03）+ 一个 apk（25.12）+ 语言包 + 校验和
  release:
    name: Publish release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > sha256sums.txt
          ls -lh
          cat sha256sums.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
